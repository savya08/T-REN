data:
  target_data: 'ade20k'
  ade_root_dir: '/path/to/ade20k/'
  cityscapes_root_dir: '/path/to/cityscapes/'
  ade_num_classes: 150
  cityscapes_num_classes: 19

logging:
  save_dir: 'logs/'
  exp_name: 'ade20k'

tren:
  pretrained:
    feature_extractor: 'dinov3_vitl16'
    text_encoder: 'dinov3_vitl16'

  architecture:
    patch_size: 16
    grid_size: 128
    hidden_dim: 1024
    text_embed_dim: 1024
    num_decoder_layers: 2
    num_attention_heads: 8

  parameters:
    image_resolution: 384
    batch_size: 16
    num_multiscale_regions: 3
    tren_region_encoder_lr: 0.001
    tren_image_encoder_lr: 0.0
    tren_text_encoder_lr: 0.0
    num_epochs: 5
    region_region_max_prompts: 64
    region_text_max_prompts: 16
    crop_ratio: 0.7
    accumulation_steps: 1
    warmup_steps: 1500
    logging_steps: 500
    max_grad_norm: 5.0
    downsample_masks: True
    mask_resolution: 32
    merging_iou_threshold: 0.8
    merging_similarity_threshold: 0.975
    num_workers: 16

  logging:
    save_dir: '../logs/'
    exp_name: 'tren-ckpts'